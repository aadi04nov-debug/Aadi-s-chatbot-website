<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadi's chatbot</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#24334a}
.app{display:flex;height:100vh;min-height:480px}
.sidebar{width:250px;background:#fff;border-right:1px solid #e1e7f0;padding:16px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:20px;font-weight:700;padding:8px 4px}
.newchat{border:1px solid #d7dfeb;background:#f8faff;color:#24334a;padding:12px;border-radius:12px;text-align:left;font-size:15px;cursor:pointer}
.history-title{font-size:12px;color:#718096;font-weight:700;margin:12px 4px 0}
#history{overflow:auto;display:flex;flex-direction:column;gap:6px}
.history-item{border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;color:#34445b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.history-item.active,.history-item:hover{background:#edf3ff}
.main{display:flex;flex:1;min-width:0;flex-direction:column}
header{background:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e5eaf2}
.heading{font-size:19px;font-weight:700}
.controls{display:flex;align-items:center;gap:8px}
select{padding:9px;border:1px solid #d4dce8;border-radius:9px;background:white;color:#34445b}
#chat{padding:20px;flex:1;overflow-y:auto}
.message{background:#fff;padding:13px 15px;border-radius:14px;margin:12px 0;max-width:85%;overflow-wrap:anywhere;box-shadow:0 2px 5px #e1e6ef;line-height:1.45;white-space:pre-wrap}
.user{background:#dce9ff;margin-left:auto}
.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e5eaf2}
input{flex:1;min-width:0;padding:13px;border:1px solid #ccd4e0;border-radius:12px;font-size:16px}
button.send{background:#2861bd;color:white;border:0;padding:0 18px;border-radius:12px;font-size:16px;cursor:pointer}
.menu{display:none;border:1px solid #d7dfeb;background:#fff;border-radius:9px;padding:8px 11px}
.note{text-align:center;color:#718096;font-size:11px;background:#fff;padding:0 10px 9px}
@media(max-width:650px){
 .sidebar{display:none;position:absolute;z-index:5;top:0;bottom:0;left:0;box-shadow:4px 0 18px #0002}
 .sidebar.open{display:flex}
 .menu{display:block}
 header{padding:12px}
 .heading{font-size:17px}
 #chat{padding:14px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">🤖 Aadi's chatbot</div>
  <button class="newchat" id="newChat">＋ New Chat</button>
  <div class="history-title">CHAT HISTORY</div>
  <div id="history"></div>
 </aside>
 <main class="main">
  <header>
   <div class="controls">
    <button class="menu" id="menuBtn" aria-label="Open chat history">☰</button>
    <div class="heading">Aadi's chatbot</div>
   </div>
   <select id="language" aria-label="Choose language">
    <option value="Auto">Language: Auto</option>
    <option>English</option><option>Hindi</option><option>Arabic</option>
    <option>Urdu</option><option>French</option><option>Spanish</option>
   </select>
  </header>
  <section id="chat" aria-live="polite"></section>
  <form class="composer" id="chatForm">
   <input id="msg" type="text" placeholder="Ask me anything..." autocomplete="off" aria-label="Your message">
   <button class="send" type="submit">Send</button>
  </form>
  <div class="note">Prototype mode — replies are demos, not generated by a real AI yet.</div>
 </main>
</div>
<script>
(function(){
 const chat=document.getElementById('chat'), input=document.getElementById('msg');
 const historyBox=document.getElementById('history'), sidebar=document.getElementById('sidebar');
 const storageKey='aadis_chat_sessions_v1';
 let sessions=[];
 try{sessions=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(sessions))sessions=[];}catch(e){sessions=[];}
 let activeId=null;
 function save(){try{localStorage.setItem(storageKey,JSON.stringify(sessions));}catch(e){}}
 function makeId(){return String(Date.now())+Math.random().toString(16).slice(2);}
 function addMessage(role,text,render=true){
  const m={role,text};
  const s=sessions.find(x=>x.id===activeId); if(s){s.messages.push(m);if(s.messages.length===1)s.title=text.slice(0,35);save();renderHistory();}
  if(render)drawMessage(m);
 }
 function drawMessage(m){
  const el=document.createElement('div');el.className='message'+(m.role==='user'?' user':'');el.textContent=m.text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
 }
 function renderHistory(){
  historyBox.textContent='';
  sessions.slice().reverse().forEach(s=>{
   const b=document.createElement('button');b.className='history-item'+(s.id===activeId?' active':'');b.textContent=s.title||'New chat';b.onclick=()=>openSession(s.id);historyBox.appendChild(b);
  });
 }
 function openSession(id){
  activeId=id;chat.textContent='';
  const s=sessions.find(x=>x.id===id);if(s)s.messages.forEach(drawMessage);
  renderHistory();sidebar.classList.remove('open');
 }
 function newChat(){
  const s={id:makeId(),title:'New chat',messages:[{role:'assistant',text:"Hello! Welcome to Aadi's chatbot. How can I help?"}]};
  sessions.push(s);activeId=s.id;save();openSession(activeId);
 }
 document.getElementById('newChat').addEventListener('click',newChat);
 document.getElementById('menuBtn').addEventListener('click',()=>sidebar.classList.toggle('open'));
 document.getElementById('chatForm').addEventListener('submit',e=>{
  e.preventDefault();const q=input.value.trim();if(!q)return;
  if(!activeId)newChat();
  addMessage('user',q);
  const lang=document.getElementById('language').value;
  addMessage('assistant',"Thanks for your message! I'm currently a demo chatbot. Real AI connection is the next step. Language setting: "+lang+".");
  input.value='';input.focus();
 });
 if(sessions.length){openSession(sessions[sessions.length-1].id);}else{newChat();}
})();
</script>
</body>
</html>
